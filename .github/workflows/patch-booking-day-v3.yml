name: Patch booking day integration V3
on:
  push:
    branches: [feature/booking-day-integration-v3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-day-integration-v3
      - name: Tighten confirmed stay day matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings-v2.js')
          s=p.read_text()
          old="function confirmedAccommodationForDay(day){return bookingsTouchingDate(day.date).find(b=>bookingIsConfirmed(b)&&accommodationCategory(b.category))}"
          new="function confirmedAccommodationForDay(day){return confirmedBookingsForDate(day.date).find(b=>accommodationCategory(b.category))}"
          if old not in s: raise SystemExit('confirmed accommodation matcher not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('bookings-v2.test.js')
          ts=t.read_text()
          marker="assert.match(code,/confirmedAccommodationForDay/,'confirmed accommodation is detected per day');"
          extra=marker+"assert.match(code,/confirmedBookingsForDate\\(day.date\\)/,'day accommodation uses protected-night matching rather than checkout-inclusive touching dates');"
          if marker in ts and 'protected-night matching' not in ts:
              ts=ts.replace(marker,extra,1)
          t.write_text(ts)
          PY
      - name: Commit V3 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js bookings-v2.test.js
          git commit -m "Use confirmed stay nights on day pages" || exit 0
          git push origin HEAD:feature/booking-day-integration-v3
