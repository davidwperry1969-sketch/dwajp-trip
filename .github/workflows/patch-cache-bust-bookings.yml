name: Patch Bookings cache bust
on:
  push:
    branches: [feature/cache-bust-bookings]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cache-bust-bookings
      - name: Version Bookings script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="bookings-v2.js"></script>'
          new='<script src="bookings-v2.js?v=20260819-1"></script>'
          if old not in s:
              if new in s: raise SystemExit(0)
              raise SystemExit('Bookings script tag not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Version Bookings script to avoid stale cache"
          git push origin HEAD:feature/cache-bust-bookings
