name: Patch Find Fill typo tolerance

on:
  push:
    branches:
      - feature/booking-find-fill

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-find-fill
      - name: Accept common Gallivant misspelling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings-v2.js')
          s=p.read_text()
          old="hotel|motel|inn|lodge|accommodation|the gallivant"
          new="hotel|motel|inn|lodge|accommodation|gallivant|galavant"
          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No typo patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js
          git commit -m "Allow common Gallivant misspelling"
          git push origin HEAD:feature/booking-find-fill
