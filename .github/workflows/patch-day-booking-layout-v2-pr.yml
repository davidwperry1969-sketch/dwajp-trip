name: Patch day booking layout v2 PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/day-booking-layout-v2
      - name: Fix confirmed booking day layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings-v2.js')
          s=p.read_text()
          start=s.index('function confirmedAccommodationForDay(day)')
          end=s.index('function printBookings()', start)
          replacement=r'''function confirmedAccommodationForDay(day){return bookingsTouchingDate(day.date).find(b=>bookingIsConfirmed(b)&&accommodationCategory(b.category))}
function confirmedBookingPlanCell(day){let b=confirmedAccommodationForDay(day);if(!b)return '';let website=safeUrl(b.website);return `<div class="cell confirmed-booking-plan"><div class="label">🎫 Confirmed booking</div><span class="day-booking-badge">🔒 CONFIRMED • LOCKED</span><div class="confirmed-plan-title"><b>${esc(b.title)}</b></div><div class="confirmed-plan-dates">📅 ${esc(bookingDateRange(b))}</div>${b.confirmation?`<div><b>Confirmation:</b> ${esc(b.confirmation)}</div>`:''}${b.notes?`<div class="confirmed-plan-notes">${esc(b.notes)}</div>`:''}${website?`<a class="btn light confirmed-plan-website" target="_blank" rel="noopener" href="${esc(website)}">🌐 Website</a>`:''}</div>`}
function bookingContactCell(day){let b=confirmedAccommodationForDay(day);if(!b)return '';let map=(b.address||b.title)?`<a class="btn light" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([b.title,b.address].filter(Boolean).join(' '))}">📍 Map</a>`:'',phone=b.contact&&cleanPhone(b.contact)?`<a class="btn light" href="tel:${esc(cleanPhone(b.contact))}">☎ Call</a>`:'',website=safeUrl(b.website)?`<a class="btn light" target="_blank" rel="noopener" href="${esc(safeUrl(b.website))}">🌐 Website</a>`:'';return `<div class="cell contact"><div class="label">Contact / address</div><div class="day-booking-contact"><div><b>${esc(b.title)}</b></div>${b.address?`<div>${esc(b.address)}</div>`:''}${b.contact?`<div>${esc(b.contact)}</div>`:''}${b.confirmation?`<div>Confirmation ${esc(b.confirmation)}</div>`:''}<div class="booking-actions">${map}${phone}${website}</div></div></div>`}
const originalDayCard=globalThis.dayCard;if(typeof originalDayCard==='function')globalThis.dayCard=function(day){let html=originalDayCard(day),confirmedStay=confirmedAccommodationForDay(day);if(!confirmedStay){let strip=dayBookingStrip(day);return strip?html.replace('<div class="notes">',strip+'<div class="notes">'):html}let planCell=confirmedBookingPlanCell(day),contactCell=bookingContactCell(day);html=html.replace(/<div class="cell"><div class="label">Plan \/ logistics<\/div><div class="value">[\s\S]*?<\/div><\/div>/,planCell);html=html.replace(/<div class="cell contact"><div class="label">Contact \/ address<\/div><div class="value">[\s\S]*?<\/div><\/div>/,contactCell);html=html.replace(/<section class="overnight-suggestions"[\s\S]*?<\/section>/,'');return html};
'''
          s=s[:start]+replacement+s[end:]
          css_anchor='.day-booking-contact>div{margin-top:3px}'
          if css_anchor in s and '.confirmed-booking-plan{' not in s:
              s=s.replace(css_anchor,css_anchor+'.confirmed-booking-plan{background:#eaf6ec;border-left:5px solid #4f9a61}.confirmed-booking-plan .day-booking-badge{background:#dff1e2;color:#24612e}.confirmed-plan-title{font-size:15px;color:var(--navy);margin:6px 0 3px}.confirmed-plan-dates{font-weight:850;margin:3px 0}.confirmed-plan-notes{margin-top:4px;color:var(--muted)}.confirmed-plan-website{margin-top:7px}.day-booking-contact .booking-actions{margin-top:7px}',1)
          p.write_text(s)
          idx=Path('index.html')
          x=idx.read_text().replace('bookings-v2.js?v=20260819-1','bookings-v2.js?v=20260819-2')
          idx.write_text(x)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js index.html
          git commit -m "Fix confirmed booking layout on day pages" || exit 0
          git push origin HEAD:fix/day-booking-layout-v2
