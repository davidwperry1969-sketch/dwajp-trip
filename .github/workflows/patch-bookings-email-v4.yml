name: Patch bookings email paste V4
on:
  push:
    branches: [feature/bookings-email-paste-v4]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bookings-email-paste-v4
      - name: Improve confirmation email parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings-v2.js')
          s=p.read_text()
          old="function parseBookingText(text){let raw=String(text||''),dates=parseDateRange(raw),ref=(raw.match(/(?:confirmation|reservation|booking(?:\\s+reference)?|reference|ref)\\s*(?:number|no\\.?|#|code)?\\s*[:#-]?\\s*([A-Z0-9-]{5,})/i)||[])[1]||'',phone=(raw.match(/(?:\\+?\\d[\\d ()-]{7,}\\d)/)||[])[0]||'',cleaned=cleanSearchText(raw);return {category:inferCategory(raw),title:cleaned,startDate:dates[0],endDate:dates[1],confirmation:ref,contact:phone,notes:''}}"
          new=r'''function emailLabelValue(raw,label){let m=String(raw||'').match(new RegExp('(?:^|\\n)\\s*'+label+'\\s*[:#-]?\\s*([^\\n]+)','i'));return m?m[1].trim():''}
function firstWebUrl(raw){let m=String(raw||'').match(/https?:\\/\\/[^\\s<>"']+/i);return m?m[0].replace(/[),.;]+$/,''):''}
function likelyAddress(raw){let lines=String(raw||'').split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);return lines.find(x=>/\\b\\d{1,6}\\s+.+\\b(?:St|Street|Rd|Road|Ave|Avenue|Blvd|Boulevard|Dr|Drive|Hwy|Highway|Ln|Lane|Way|Pl|Place|Ct|Court)\\b/i.test(x))||emailLabelValue(raw,'(?:address|location|hotel address|property address)')}
function labelledDate(raw,label){let value=emailLabelValue(raw,label);if(!value)return '';let m=value.match(/(\\d{1,2})(?:st|nd|rd|th)?[ \\/-]+([A-Za-z]+)(?:[ \\/-]+(20\\d{2}))?/i);if(m&&MONTHS[m[2].toLowerCase()])return isoDate(m[1],m[2],m[3]||'2026');let ymd=value.match(/\\b(20\\d{2})-(\\d{1,2})-(\\d{1,2})\\b/);if(ymd)return `${ymd[1]}-${String(ymd[2]).padStart(2,'0')}-${String(ymd[3]).padStart(2,'0')}`;return ''}
function parseBookingText(text){let raw=String(text||''),dates=parseDateRange(raw),checkIn=labelledDate(raw,'(?:check[- ]?in|arrival|pickup|pick up)'),checkOut=labelledDate(raw,'(?:check[- ]?out|departure|return|drop[- ]?off|drop off)'),ref=(raw.match(/(?:confirmation|reservation|booking(?:\\s+reference)?|reference|ref|record locator|confirmation code)\\s*(?:number|no\\.?|#|code)?\\s*[:#-]?\\s*([A-Z0-9-]{4,})/i)||[])[1]||'',phone=(raw.match(/(?:\\+?\\d[\\d ()-]{7,}\\d)/)||[])[0]||'',provider=emailLabelValue(raw,'(?:hotel|property|provider|airline|company|rental company)'),subject=emailLabelValue(raw,'(?:subject)'),cleaned=cleanSearchText(provider||subject||raw),address=likelyAddress(raw)||'',website=firstWebUrl(raw)||'';return {category:inferCategory(raw),title:cleaned,startDate:checkIn||dates[0],endDate:checkOut||dates[1],confirmation:ref,contact:phone,address,website,notes:''}}'''
          if old not in s: raise SystemExit('parseBookingText target not found')
          s=s.replace(old,new,1)
          s=s.replace('Type or speak something simple, for example: “The Gallivant NYC 1 September to 4 September”. Then tap FIND & FILL DETAILS.','Paste a confirmation email, type a booking, or speak it. DWAJP will pull out what it can, then you check before saving.')
          s=s.replace("setValue('bookingConfirmation',parsed.confirmation);setValue('bookingContact',parsed.contact);", "setValue('bookingConfirmation',parsed.confirmation);setValue('bookingContact',parsed.contact);setValue('bookingAddress',parsed.address);setValue('bookingWebsite',parsed.website);refreshBookingWebsiteButton();")
          p.write_text(s)

          t=Path('bookings-v2.test.js')
          ts=t.read_text()
          insert="""\nconst email=api.parseBookingText('Subject: Your hotel booking\\nHotel: Test Hotel\\nCheck-in: 12 September 2026\\nCheck-out: 15 September 2026\\nConfirmation code: ABC123\\n123 Main Street, New York\\n+1 212 555 0100\\nhttps://example.com/manage');assert.equal(email.startDate,'2026-09-12');assert.equal(email.endDate,'2026-09-15');assert.equal(email.confirmation,'ABC123');assert.match(email.address,/123 Main Street/);assert.match(email.website,/example\\.com/);\n"""
          marker="console.log('bookings-v2 Find & Fill tests passed');"
          if marker in ts and 'const email=api.parseBookingText' not in ts: ts=ts.replace(marker,insert+marker)
          t.write_text(ts)
          PY
      - name: Commit V4 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js bookings-v2.test.js
          git commit -m "Parse pasted confirmation emails into bookings" || exit 0
          git push origin HEAD:feature/bookings-email-paste-v4
