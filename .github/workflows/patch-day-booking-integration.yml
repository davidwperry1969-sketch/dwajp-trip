name: Patch day booking integration
on:
  push:
    branches: [feature/day-booking-integration]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/day-booking-integration
      - name: Integrate confirmed bookings into day cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bookings-v2.js')
          s=p.read_text()
          old="function dayBookingStrip(day){let items=bookingsTouchingDate(day.date);if(!items.length)return '';return `<section class=\"day-bookings\"><div class=\"label\">🎫 BOOKINGS</div>${items.map(b=>`<div class=\"day-booking-row ${bookingIsConfirmed(b)?'day-booking-confirmed':'day-booking-unconfirmed'}\"><span class=\"day-booking-badge\">${bookingIsConfirmed(b)?'🔒 CONFIRMED • LOCKED':'🟡 NOT CONFIRMED'}</span><div><b>${esc(b.title)}</b> • ${esc(b.category)}${b.confirmation?` • Confirmation ${esc(b.confirmation)}`:''}</div></div>`).join('')}</section>`}const originalDayCard=globalThis.dayCard;if(typeof originalDayCard==='function')globalThis.dayCard=function(day){let html=originalDayCard(day),strip=dayBookingStrip(day);return strip?html.replace('<div class=\"notes\">',strip+'<div class=\"notes\">'):html};"
          new="function dayBookingStrip(day){let items=bookingsTouchingDate(day.date);if(!items.length)return '';return `<section class=\"day-bookings\"><div class=\"label\">🎫 BOOKINGS</div>${items.map(b=>`<div class=\"day-booking-row ${bookingIsConfirmed(b)?'day-booking-confirmed':'day-booking-unconfirmed'}\"><span class=\"day-booking-badge\">${bookingIsConfirmed(b)?'🔒 CONFIRMED • LOCKED':'🟡 NOT CONFIRMED'}</span><div><b>${esc(b.title)}</b> • ${esc(b.category)}${b.confirmation?` • Confirmation ${esc(b.confirmation)}`:''}</div></div>`).join('')}</section>`}\nfunction confirmedAccommodationForDay(day){return bookingsTouchingDate(day.date).find(b=>bookingIsConfirmed(b)&&accommodationCategory(b.category))}\nfunction bookingContactBlock(day){let b=confirmedAccommodationForDay(day);if(!b)return '';let lines=[`<b>${esc(b.title)}</b>`,b.address?esc(b.address):'',b.contact?esc(b.contact):'',b.confirmation?`Confirmation ${esc(b.confirmation)}`:'',b.website?`<a class=\"placeLink\" target=\"_blank\" rel=\"noopener\" href=\"${esc(safeUrl(b.website))}\">Website</a>`:''].filter(Boolean);return `<div class=\"day-booking-contact\"><span class=\"day-booking-badge\">🔒 CONFIRMED • LOCKED</span>${lines.map(x=>`<div>${x}</div>`).join('')}</div>`}\nconst originalDayCard=globalThis.dayCard;if(typeof originalDayCard==='function')globalThis.dayCard=function(day){let html=originalDayCard(day),strip=dayBookingStrip(day),confirmedStay=confirmedAccommodationForDay(day);if(strip)html=html.replace('<div class=\"grid\">','<div class=\"grid\"><div class=\"cell booking-day-top\" style=\"grid-column:1/-1\">'+strip+'</div>');let contact=bookingContactBlock(day);if(contact)html=html.replace('<div class=\"cell contact\"><div class=\"label\">Contact / address</div><div class=\"value\">','<div class=\"cell contact\"><div class=\"label\">Contact / address</div>'+contact+'<div class=\"value\">');if(confirmedStay)html=html.replace(/<div class=\"overnight-suggestions\"[\\s\\S]*?<\\/div><\\/div><\\/div>/,'');return html};"
          if old not in s: raise SystemExit('day booking wrapper target not found')
          s=s.replace(old,new,1)
          css_old='.day-booking-confirmed .day-booking-badge{background:#dff1e2;color:#24612e}.day-booking-unconfirmed .day-booking-badge{background:#fff1c8;color:#6b5200}'
          css_new=css_old+'.booking-day-top{padding:0!important;background:#f7fbff}.booking-day-top .day-bookings{border-bottom:0}.day-booking-contact{margin:0 0 8px;padding:8px;border-radius:10px;background:#eaf6ec;border-left:4px solid #4f9a61}.day-booking-contact>div{margin-top:3px}'
          if css_old not in s: raise SystemExit('booking css target not found')
          s=s.replace(css_old,css_new,1)
          p.write_text(s)
          t=Path('bookings-v2.test.js')
          ts=t.read_text()
          marker="assert.match(code,/day-booking-confirmed/,'confirmed day booking styling exists');"
          add=marker+"assert.match(code,/confirmedAccommodationForDay/,'confirmed accommodation is detected per day');assert.match(code,/bookingContactBlock/,'confirmed booking details flow into day contact section');assert.match(code,/overnight-suggestions/,'day integration can suppress overnight suggestions when a stay is confirmed');"
          if marker not in ts: raise SystemExit('test marker not found')
          t.write_text(ts.replace(marker,add,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js bookings-v2.test.js
          git commit -m "Integrate confirmed bookings into day pages"
          git push origin HEAD:feature/day-booking-integration
