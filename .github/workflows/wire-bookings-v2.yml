name: Wire Bookings V2

on:
  push:
    branches:
      - feature/bookings-overhaul

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bookings-overhaul

      - name: Load unified bookings after the main app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="bookings-v2.js"></script>'
          marker = '</script></body></html>'

          if tag not in text:
              if marker not in text:
                  raise SystemExit('Expected closing script/body marker not found')
              text = text.replace(marker, f'</script>\n{tag}\n</body></html>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-off workflow and commit integration
        shell: bash
        run: |
          git rm .github/workflows/wire-bookings-v2.yml
          if git diff --quiet; then
            echo "No integration change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: enable unified bookings UI"
          git push origin HEAD:feature/bookings-overhaul
