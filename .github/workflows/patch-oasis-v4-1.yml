name: Patch Oasis email V4.1
on:
  push:
    branches: [fix/bookings-v4-1-oasis-email]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bookings-v4-1-oasis-email
      - name: Patch real-world Oasis confirmation parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('bookings-v2.js')
          s=p.read_text()

          s=s.replace("if(/train|rail/.test(lower))return 'Train';", "if(/rv park|rv resort|campground|campsite/.test(lower)||/camp_site|caravan_site/.test(type))return 'RV Park / Campground';if(/\\b(?:train|rail)\\b/.test(lower))return 'Train';")
          s=s.replace("if(/rv park|rv resort|campground|campsite/.test(lower)||/camp_site|caravan_site/.test(type))return 'RV Park / Campground';if(/hotel", "if(/hotel")

          old="function likelyAddress(raw){let lines=String(raw||'').split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);return lines.find(x=>/\\b\\d{1,6}\\s+.+\\b(?:St|Street|Rd|Road|Ave|Avenue|Blvd|Boulevard|Dr|Drive|Hwy|Highway|Ln|Lane|Way|Pl|Place|Ct|Court)\\b/i.test(x))||emailLabelValue(raw,'(?:address|location|hotel address|property address)')}"
          new="function likelyAddress(raw){let text=String(raw||''),lines=text.split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean),labelled=emailLabelValue(text,'(?:address|hotel address|property address)');if(labelled){let i=lines.findIndex(x=>x.toLowerCase().includes(labelled.toLowerCase()));let next=i>=0?lines[i+1]||'':'';return /[A-Za-z].*\\b\\d{5}(?:-\\d{4})?\\b/.test(next)?labelled+', '+next:labelled}return lines.find(x=>/^\\d{1,6}\\s+[A-Za-z0-9 .'-]+\\b(?:St|Street|Rd|Road|Ave|Avenue|Blvd|Boulevard|Dr|Drive|Hwy|Highway|Ln|Lane|Way|Pl|Place|Ct|Court)\\b/i.test(x))||''}"
          if old not in s: raise SystemExit('likelyAddress target missing')
          s=s.replace(old,new,1)

          old="function labelledDate(raw,label){let value=emailLabelValue(raw,label);if(!value)return '';let m=value.match(/(\\d{1,2})(?:st|nd|rd|th)?[ \\/-]+([A-Za-z]+)(?:[ \\/-]+(20\\d{2}))?/i);if(m&&MONTHS[m[2].toLowerCase()])return isoDate(m[1],m[2],m[3]||'2026');let ymd=value.match(/\\b(20\\d{2})-(\\d{1,2})-(\\d{1,2})\\b/);if(ymd)return `${ymd[1]}-${String(ymd[2]).padStart(2,'0')}-${String(ymd[3]).padStart(2,'0')}`;return ''}"
          new="function labelledDate(raw,label){let value=emailLabelValue(raw,label);if(!value)return '';let m=value.match(/(\\d{1,2})(?:st|nd|rd|th)?[ \\/-]+([A-Za-z]+)(?:[ \\/-]+(20\\d{2}))?/i);if(m&&MONTHS[m[2].toLowerCase()])return isoDate(m[1],m[2],m[3]||'2026');let us=value.match(/\\b(\\d{1,2})[\\/-](\\d{1,2})[\\/-](20\\d{2})\\b/);if(us)return `${us[3]}-${String(us[1]).padStart(2,'0')}-${String(us[2]).padStart(2,'0')}`;let ymd=value.match(/\\b(20\\d{2})-(\\d{1,2})-(\\d{1,2})\\b/);if(ymd)return `${ymd[1]}-${String(ymd[2]).padStart(2,'0')}-${String(ymd[3]).padStart(2,'0')}`;return ''}"
          if old not in s: raise SystemExit('labelledDate target missing')
          s=s.replace(old,new,1)

          marker="function confirmationReference(raw)"
          helper="function providerFromEmail(raw){let labelled=emailLabelValue(raw,'(?:hotel|property|provider|airline|company|rental company)');if(labelled)return labelled;let subject=emailLabelValue(raw,'subject'),m=subject.match(/(?:reservation\\s+)?confirmation\\s+from\\s+(.+)/i);if(m)return m[1].trim();m=String(raw||'').match(/thank you for booking with\\s+([^\\n.]+)/i);return m?m[1].trim():''}\n"
          if helper.strip() not in s:
              s=s.replace(marker,helper+marker,1)

          old="provider=emailLabelValue(raw,'(?:hotel|property|provider|airline|company|rental company)'),subject=emailLabelValue(raw,'subject'),cleaned=cleanSearchText(provider||subject||raw)"
          new="provider=providerFromEmail(raw),subject=emailLabelValue(raw,'subject'),cleaned=cleanSearchText(provider||subject||raw)"
          if old not in s: raise SystemExit('provider parse target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('bookings-v2.test.js')
          ts=t.read_text()
          oasis="""\nconst oasis=api.parseBookingText('Subject: Reservation Confirmation From Oasis Las Vegas RV Resort\\nDavid Perry,\\nThank you for booking with Oasis Las Vegas RV Resort. If you have any questions, please call our booking line at +1 (702) 260-2001.\\nConfirmation Number: 2026453970\\nCheck-in Date: 10/03/2026\\nCheck-In Time: 12:00 PM\\nCheck-out Date: 10/05/2026\\nCheck-Out Time: 12:00 PM\\nUnit Type: BIG RIG - NM\\nNumber of Nights: 2\\nCharges: $218.90\\n*Through the Hoover Dam Area, 93/95 to the 215\\nAddress: 2711 W Windmill Lane\\nLas Vegas, Nevada, 89123');assert.equal(oasis.category,'RV Park / Campground','Transient text must not be mistaken for Train');assert.equal(oasis.title,'Oasis Las Vegas RV Resort');assert.equal(oasis.startDate,'2026-10-03');assert.equal(oasis.endDate,'2026-10-05');assert.equal(oasis.confirmation,'2026453970');assert.match(oasis.contact,/702.*260.*2001/);assert.match(oasis.address,/2711 W Windmill Lane/);assert.doesNotMatch(oasis.address,/Hoover Dam/);\n"""
          marker="console.log('bookings-v2 Find & Fill + email paste tests passed');"
          if marker in ts and 'const oasis=api.parseBookingText' not in ts: ts=ts.replace(marker,oasis+marker)
          t.write_text(ts)
          PY
      - name: Commit V4.1 parser and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bookings-v2.js bookings-v2.test.js
          git commit -m "Fix Oasis confirmation email parsing" || exit 0
          git push origin HEAD:fix/bookings-v4-1-oasis-email
