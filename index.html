function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function mergedDays(){return DAYS.map(d=>({...d,...(state.days?.[d.date]||{})}))}
function statusClass(s){return String(s||'PLANNED').toUpperCase().replace(/[^A-Z]/g,'')}
function pressure(d){let km=((d.weather||'').match(/(\d[\d,]*) ?km/)||[])[1]; km=km?parseInt(km.replace(',','')):0; let p=km>650?'high':km>450?'busy':km>250?'comfy':'easy'; if((d.plan||'').includes('BUFFER')||d.status==='OPTIONAL')p='easy'; return p}
function pressureLabel(p){return {easy:'EASY',comfy:'COMFORTABLE',busy:'BUSY',high:'HIGH'}[p]}
function mapButtons(d){return `<div class="actions"><a class="btn blue" href="${esc(d.maps)}" target="_blank">📍 Navigate</a><a class="btn navy" href="${esc(d.route_maps)}" target="_blank">🚐 Route</a><a class="btn light" href="${esc(d.detour_maps)}" target="_blank">⭐ Detour</a><a class="btn edit" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.contact.replace(/<br\/>/g,' '))}" target="_blank">🏨 Contact / address</a>${d.date==='2026-10-27'?`<a class="btn gold" href="${LINKS.qantasCheckin}" target="_blank">✅ Qantas Check-in</a><a class="btn light" href="${LINKS.qantas}" target="_blank">🎫 Manage Qantas</a>`:''}${d.date==='2026-10-20'?`<a class="btn light" href="${LINKS.hertz}" target="_blank">🚙 Hertz</a>`:''}</div>`}
function dayCard(d){let p=pressure(d);let key=statusClass(d.status);let note=state.notes?.[d.date]||'';return `<article class="card" id="day-${d.date}"><div class="cardhead"><div class="date">${esc(d.dow)} • ${esc(d.short)} <span class="badge ${key}">${esc(d.status||'PLANNED')}</span></div><div class="dest">${esc(d.dest)}</div><div class="meta">🌡️ ${esc(d.weather)} • <b>Pressure: ${pressureLabel(p)}</b><div class="pressure ${p}"><i></i></div></div></div><div class="grid"><div class="cell"><div class="label">🧭 Plan / logistics</div><div class="value">${esc(d.plan)}</div></div><div class="cell detour"><div class="label">⭐ Detour / if we have time</div><div class="value">${esc(d.detour)}</div></div><div class="cell contact"><div class="label">📞 Contact / address</div><div class="value">${esc((d.contact||'').replace(/<br\/>/g,'\n'))}</div></div><div class="cell"><div class="label">🛣️ Travel</div><div class="value">Use padded travel windows • fuel / breaks / traffic / setup are allowed for.</div></div></div>${mapButtons(d)}<div class="notes"><div class="label">✍️ Notes</div><textarea placeholder="Add notes, booking numbers, costs, changes…" onchange="saveNote('${d.date}',this.value)">${esc(note)}</textarea><div class="savehint">Saved on this device.</div></div><div class="actions"><button class="btn edit" onclick="openEdit('${d.date}')">✏️ Edit day</button></div></article>`}
function renderHome(){nav('home');let ds=mergedDays();let start=new Date('2026-09-01T00:00:00'), today=new Date();let diff=Math.ceil((start-today)/86400000);let inTrip=today>=start&&today<=new Date('2026-10-27T23:59:59');let current=ds.find(d=>d.date===today.toISOString().slice(0,10))||ds[0];document.getElementById('app').innerHTML=`<div class="hero"><h2>${inTrip?'📅 TODAY’S PLAN':'🚐 TRIP CONTROL CENTRE'}</h2><p>${inTrip?esc(current.dest):diff>0?`Trip starts in <b>${diff} days</b> • ${esc(ds[0].dest)}`:'Trip dates are complete'}</p><p>Truth Mode is on: confirmed items stay confirmed; uncertain items stay visible as uncertain.</p></div><div class="dashboard"><button class="dashbtn" onclick="showToday()">📅 TODAY<small>What matters now</small></button><button class="dashbtn" onclick="showActions()">✅ ACTIONS<small>Things to check / do</small></button><button class="dashbtn" onclick="showTransport()">🎫 TRANSPORT<small>Flights, trains, buses, ferries, ships</small></button>
<button class="dashbtn" onclick="showBookings()">🎫 BOOKINGS<small>Stays, RV, car & reservations</small></button><button class="dashbtn" onclick="showMaps()">🗺️ MAPS<small>Destinations & detours</small></button><button class="dashbtn" onclick="showRv()">🚐 RV & CAR<small>Vehicle details</small></button><button class="dashbtn" onclick="showContacts()">📞 CONTACTS<small>Important numbers</small></button><button class="dashbtn" onclick="showMust()">❤️ PRIORITIES<small>Must / nice / drop</small></button><button class="dashbtn" onclick="showExpenses()">💰 EXPENSES<small>Running trip total</small></button><button class="dashbtn" onclick="showDiary()">📸 TRIP DIARY<small>Memories & notes</small></button><button class="dashbtn" onclick="showServices()">⛽ RV SERVICES<small>Fuel, dump, propane</small></button><button class="dashbtn" onclick="showCamping()">🏕️ CAMPING<small>Free camping & boondocking</small></button><button class="dashbtn" onclick="showAlter()">✏️ ALTER TRIP<small>Add / change / remove</small></button><button class="dashbtn" onclick="showSummary()">📊 SUMMARY<small>Spreadsheet view</small></button><button class="dashbtn" onclick="window.print()">🖨️ PRINT CALENDAR<small>1 week per landscape page</small></button><button class="dashbtn" onclick="setTextSize()">👓 TEXT SIZE<small>Standard / Large / Extra Large</small></button><button class="dashbtn" onclick="resetEdits()">↩️ RESET EDITS<small>Restore original draft</small></button></div><div class="section"><h3>🔥 The rules for this trip</h3><div class="panel"><div class="kpi"><div class="k"><b>🟢</b><span>CONFIRMED</span></div><div class="k"><b>🟡</b><span>PLANNED</span></div><div class="k"><b>🟠</b><span>OPTIONAL</span></div></div><ul class="list"><li>Houston is <b>skipped</b> to reduce pressure.</li><li>Memphis is a <b>drive-through + Graceland</b> stop. Pay homage to the King 😂.</li><li>Detroit = <b>friends in Ortonville + Henry Ford Museum</b>.</li><li>Milwaukee = <b>friends / local time</b>.</li><li>Tijuana = <b>optional</b> if time is short.</li><li>Disneyland = <b>must do for Andrea</b>; later arrival, no rides, fireworks are the priority.</li><li>The larger RV stays — your 30+ years of semi-truck experience makes vehicle size a non-issue for this plan.</li></ul></div></div><div id="content"></div>`;renderWeeks(ds)}
function renderWeeks(ds){let c=document.getElementById('content');let out='';for(let w=1;w<=9;w++){let wd=ds.filter(d=>d.week===w);if(!wd.length)continue;out+=`<section class="printweek snapTarget" id="week-${w}"><div class="weekhead"><h2>${esc(wd[0].weektitle)}</h2><p>${esc(wd[0].route)}</p></div>`+wd.map(dayCard).join('')+`</section>`}c.innerHTML=out}

function showToday(){let ds=mergedDays(), now=new Date().toISOString().slice(0,10), d=ds.find(x=>x.date===now)||ds[0];document.getElementById('content').innerHTML=`<div class="weekhead"><h2>📅 TODAY / NEXT DAY</h2><p>${esc(d.short)} • ${esc(d.dest)}</p></div>${dayCard(d)}`;window.scrollTo({top:180,behavior:'smooth'})}
function showActions(){let ds=mergedDays();let items=[];ds.forEach(d=>{if((d.status||'').includes('CHECK'))items.push(`🔴 ${d.short}: ${d.plan}`)});items.push('🟡 Verify Yellowstone late-season road / campground Plan A + Plan B');items.push('🟡 Verify Yosemite RV campsite / exact site length');items.push('🟡 Verify Hertz return-to-Qantas-terminal transfer at LAX');items.push('🟡 Verify any remaining accommodation / event reservations');document.getElementById('content').innerHTML=`<div class="section"><h3>✅ TODAY’S ACTIONS / OUTSTANDING</h3><div class="panel"><ul class="list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`}
function backBar(){return `<div class="backbar"><button class="backbtn" onclick="renderHome();window.scrollTo({top:0,behavior:'smooth'})">← Back to Trip</button></div>`}
function showTransport(){document.getElementById('content').innerHTML=backBar()+`<div class="section snapTarget"><h3>🎫 TRANSPORT</h3><div class="panel"><p class="muted">All booked transport lives here and also appears in the relevant day of the itinerary.</p><div class="transportItem">✈️ <b>Alaska AS688</b><br>20 Oct • SEA 13:55 → SFO 16:08<br><span class="muted">Flight • carried in itinerary</span></div><div class="transportItem">✈️ <b>Qantas QF94</b><br>27 Oct • LAX 23:50 → Melbourne 09:30 Thu<br><span class="muted">Booking D4I8WC • VERIFY time against ticket</span></div><div class="transportItem">🚐 <b>Cruise America RV</b><br>Pickup 4 Sep 13:00–17:00 • Bay Shore<br>Return 20 Oct 09:00–11:00 • Everett</div><div class="transportItem">➕ <b>Future transport</b><br>Trains • buses • passenger ferries • ships/cruises • transfers can be added here.</div></div></div>`;window.scrollTo({top:170,behavior:'smooth'})}
function showCamping(){document.getElementById('content').innerHTML=backBar()+`<div class="section snapTarget"><h3>🏕️ CAMPING & BOONDOCKING</h3><div class="panel"><p>Use live searches based on the location you are actually travelling through.</p><div class="actions"><a class="btn green" href="https://www.google.com/maps/search/?api=1&query=free+camping+near+me" target="_blank">🆓 Free camping</a><a class="btn blue" href="https://www.google.com/maps/search/?api=1&query=boondocking+near+me" target="_blank">🏕️ Boondocking</a><a class="btn light" href="https://www.google.com/maps/search/?api=1&query=RV+campground+near+me" target="_blank">🚐 RV campgrounds</a></div><p class="muted">Specialist camping services can be added later without replacing them.</p></div></div>`;window.scrollTo({top:170,behavior:'smooth'})}
function showSummary(){let ds=mergedDays();document.getElementById('content').innerHTML=backBar()+`<div class="section snapTarget"><h3>📊 TRIP SUMMARY</h3><div class="panel"><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid var(--line)">Date</th><th style="text-align:left;padding:8px;border-bottom:2px solid var(--line)">Destination</th><th style="text-align:left;padding:8px;border-bottom:2px solid var(--line)">Travel</th><th style="text-align:left;padding:8px;border-bottom:2px solid var(--line)">Status</th></tr></thead><tbody>${ds.map(d=>`<tr><td style="padding:7px;border-bottom:1px solid var(--line)">${esc(d.short)}</td><td style="padding:7px;border-bottom:1px solid var(--line)">${esc(d.dest)}</td><td style="padding:7px;border-bottom:1px solid var(--line)">${esc(d.weather)}</td><td style="padding:7px;border-bottom:1px solid var(--line)">${esc(d.status||'PLANNED')}</td></tr>`).join('')}</tbody></table></div></div></div>`;window.scrollTo({top:170,behavior:'smooth'})}
function showAlter(){document.getElementById('alterModal').classList.add('open')}
function closeAlter(){document.getElementById('alterModal').classList.remove('open')}
function alterCandidates(text){let q=text.toLowerCase().replace(/[^a-z0-9\s]/g,' ');let words=q.split(/\s+/).filter(w=>w.length>2&&!['add','the','good','stop','somewhere','along','our','route','please','want','would','like'].includes(w));let ds=mergedDays();let matches=ds.map(d=>{let hay=[d.dest,d.plan,d.detour,d.route,d.contact].join(' ').toLowerCase();let score=0;words.forEach(w=>{if(hay.includes(w))score+=2});if(q.includes('texas')&&hay.includes('texas'))score+=8;if(q.includes('bbq')&&hay.includes('bbq'))score+=8;if(q.includes('vegas')&&hay.includes('las vegas'))score+=8;if(q.includes('yellowstone')&&hay.includes('yellowstone'))score+=8;if(q.includes('yosemite')&&hay.includes('yosemite'))score+=8;return {d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);return matches.slice(0,6).map(x=>x.d)}
function proposeAlter(){let action=document.getElementById('alterAction').value,text=document.getElementById('alterText').value.trim();if(!text){alert('Tell me what you want to add, change or remove.');return}closeAlter();let matches=alterCandidates(text);let first=matches[0];let list=matches.length?matches.map((d,i)=>`<button class="btn ${i===0?'gold':'light'}" onclick="applyAlter('${d.date}',${JSON.stringify(action)},${JSON.stringify(text)})">${i===0?'⭐ Suggested: ':'📅 '}${esc(d.short)} • ${esc(d.dest)}</button>`).join(''):'<p>🔎 I could not confidently locate the correct part of the itinerary yet. Choose a date below.</p>';document.getElementById('content').innerHTML=backBar()+`<div class="section snapTarget"><h3>✏️ PROPOSED TRIP CHANGE</h3><div class="panel"><p><b>${action==='add'?'➕ ADD':action==='change'?'✏️ CHANGE':'➖ REMOVE'}</b></p><p>${esc(text)}</p><p class="muted">DWAJP searched the whole itinerary rather than using the screen you were on.</p><div class="actions">${list}</div><div class="field"><label>Or choose a date</label><input id="alterDate" type="date" min="2026-09-01" max="2026-10-27" value="${first?first.date:'2026-09-25'}"><button class="btn navy" onclick="applyAlter(document.getElementById('alterDate').value,${JSON.stringify(action)},${JSON.stringify(text)})">Use this date</button></div></div></div>`;window.scrollTo({top:170,behavior:'smooth'})}
function setTextSize(){let cur=document.body.classList.contains('xlarge')?'xlarge':document.body.classList.contains('large')?'large':'standard';let next=cur==='standard'?'large':cur==='large'?'xlarge':'standard';document.body.classList.remove('large','xlarge');if(next!=='standard')document.body.classList.add(next);localStorage.setItem('DWAJP_TEXT_SIZE',next);alert('Text size: '+(next==='standard'?'Standard':next==='large'?'Large':'Extra Large'))}
function loadTextSize(){let s=localStorage.getItem('DWAJP_TEXT_SIZE');if(s==='large'||s==='xlarge')document.body.classList.add(s)}
function showBookings(){document.getElementById('content').innerHTML=`<div class="section"><h3>🎫 CONFIRMED / KEY BOOKINGS</h3><div class="panel"><ul class="list"><li>🟢 French Quarter RV Resort • 22–24 Sep • Confirmation 2026075827 • +1 504-586-3000</li><li>🟢 Hertz RAM 2500 Big Horn or similar • 20 Oct 13:00 SFO → 27 Oct 20:00 Signature Aviation LAX • L670E2340B5</li><li>🟢 Qantas QF94 • 27 Oct • LAX 23:50 → Melbourne 09:30 (Thu) • Ref D4I8WC</li><li>🟢 Alaska AS688 • 20 Oct • SEA 13:55 → SFO 16:08 (as carried in itinerary)</li></ul><div class="actions"><a class="btn red" href="${LINKS.qantasCheckin}" target="_blank">✅ Qantas Check-in</a><a class="btn light" href="${LINKS.qantas}" target="_blank">🎫 Qantas Manage Booking</a><a class="btn light" href="${LINKS.hertz}" target="_blank">🚙 Hertz</a><a class="btn light" href="${LINKS.cruise}" target="_blank">🚐 Cruise America</a></div></div></div>`}
function showRv(){document.getElementById('content').innerHTML=`<div class="section"><h3>🚐 RV & CAR CONTROL</h3><div class="panel"><ul class="list"><li><b>RV:</b> larger ~30-ft RV retained — better value and suited to your driving experience.</li><li><b>RV pickup:</b> Cruise America Bay Shore • 1490 Sunrise Hwy, Bay Shore NY • +1 631-667-2342 • 4 Sep 13:00–17:00</li><li><b>RV return:</b> Cruise America Everett • 12201 WA-99, Everett WA • +1 425-355-8935 • 20 Oct 09:00–11:00</li><li><b>Car:</b> Hertz RAM 2500 Big Horn or similar • Confirmation L670E2340B5</li><li><b>SFO pickup:</b> 780 McDonnell Rd, San Francisco CA 94128 • +1 650-624-6600 • 20 Oct 13:00</li><li><b>LAX return:</b> Signature Aviation Los Angeles LAX (Private Flights Only) • 6201 W Imperial Hwy, Los Angeles CA 90045 • +1 310-568-5100 • 27 Oct 20:00</li></ul></div></div>`}
function showContacts(){document.getElementById('content').innerHTML=`<div class="section"><h3>📞 IMPORTANT CONTACTS</h3><div class="panel"><ul class="list"><li>🚐 Cruise America 24/7 assistance • <span class="phone">1-800-334-4110</span></li><li>🚐 Cruise America reservations • <span class="phone">1-800-671-8042</span></li><li>🚐 Bay Shore • <span class="phone">+1 631-667-2342</span></li><li>🚐 Everett • <span class="phone">+1 425-355-8935</span></li><li>🚙 Hertz SFO • <span class="phone">+1 650-624-6600</span></li><li>🚙 Hertz LAX return • <span class="phone">+1 310-568-5100</span></li><li>🏨 French Quarter RV Resort • <span class="phone">+1 504-586-3000</span></li><li>✈️ Qantas • Australia <span class="phone">1300 655 234</span></li></ul></div></div>`}
function showMust(){document.getElementById('content').innerHTML=`<div class="section"><h3>❤️ PRIORITIES</h3><div class="panel"><h4>❤️ MUST DO</h4><ul class="list"><li>Disneyland for Andrea — later arrival + fireworks, no rides needed.</li><li>Graceland — Memphis homage to Elvis 😂.</li><li>Henry Ford Museum — Detroit with friends.</li><li>Confirmed stays / flights / vehicle handovers.</li></ul><h4>⭐ NICE IF WE HAVE TIME</h4><ul class="list"><li>Philadelphia, Gettysburg, Tijuana, optional Route 66 detours, extra local sightseeing.</li></ul><h4>🗑️ DROP FIRST IF PRESSURE BUILDS</h4><ul class="list"><li>Tijuana</li><li>Minor detours after long driving days</li><li>Anything that competes with confirmed bookings or Disneyland fireworks.</li></ul></div></div>`}
function showExpenses(){let e=state.expenses||[];let total=e.reduce((a,x)=>a+(+x.amount||0),0);document.getElementById('content').innerHTML=`<div class="section"><h3>💰 EXPENSES</h3><div class="panel"><div class="kpi"><div class="k"><b>$${total.toFixed(2)}</b><span>LOCAL TOTAL ENTERED</span></div><div class="k"><b>${e.length}</b><span>ITEMS</span></div><div class="k"><b>EDITABLE</b><span>ON THIS DEVICE</span></div></div><div class="field"><label>New expense</label><input id="exdesc" placeholder="Fuel / food / parking…"><input id="examt" type="number" step="0.01" placeholder="Amount"><button class="btn navy" onclick="addExpense()">Add</button></div><ul class="list">${e.map((x,i)=>`<li>${esc(x.desc)} — $${(+x.amount||0).toFixed(2)} <button class="btn light" onclick="delExpense(${i})">Delete</button></li>`).join('')}</ul></div></div>`}
function showDiary(){let d=state.diary||'';document.getElementById('content').innerHTML=`<div class="section"><h3>📸 TRIP DIARY</h3><div class="panel"><textarea id="diary" style="min-height:260px" placeholder="Best day… funniest moment… favourite meal…">${esc(d)}</textarea><button class="btn navy" onclick="saveDiary()">Save diary</button><p class="muted">Saved on this device. Photos can be added to the phone/iPad Photos app and referenced here.</p></div></div>`}
function showServices(){document.getElementById('content').innerHTML=`<div class="section"><h3>⛽ RV SERVICES</h3><div class="panel"><p>Use Google Maps to find these close to your current position:</p><div class="actions"><a class="btn blue" href="https://www.google.com/maps/search/?api=1&query=RV+fuel+station" target="_blank">⛽ RV-friendly fuel</a><a class="btn navy" href="https://www.google.com/maps/search/?api=1&query=RV+dump+station" target="_blank">🚽 Dump station</a><a class="btn light" href="https://www.google.com/maps/search/?api=1&query=RV+propane" target="_blank">🔥 Propane</a><a class="btn light" href="https://www.google.com/maps/search/?api=1&query=RV+laundromat" target="_blank">🧺 Laundry</a></div><p class="muted">These are live Google Maps searches rather than pre-selected businesses, so you can choose based on where you actually are.</p></div></div>`}
function setActiveNav(active){document.querySelectorAll('#nav .pill').forEach((b,i)=>b.classList.toggle('active', active==='home'?i===0:active==='all'?i===10:i===Number(active.slice(1))))}
function syncStickyOffset(){let h=document.querySelector('header')?.offsetHeight||70;let n=document.querySelector('.statusbar')?.offsetHeight||44;document.documentElement.style.setProperty('--sticky-offset',(h+n)+'px')}
function showMaps(){let ds=mergedDays(),seen=new Set(),places=ds.map(d=>d.dest).filter(x=>x&&!seen.has(x)&&seen.add(x));document.getElementById('content').innerHTML='<section class="section"><div class="backbar"><button class="backbtn" onclick="renderHome()">← Back to Trip</button></div><h3>🗺️ MAPS & DESTINATIONS</h3><div class="panel"><p class="muted">Choose a destination to open it in Google Maps.</p><div class="actions">'+places.map(p=>'<a class="btn navy" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p)+'" target="_blank">📍 '+esc(p)+'</a>').join('')+'</div></div></section>';window.scrollTo({top:0,behavior:'smooth'})}
function showAll(){nav('all');renderWeeks(mergedDays());requestAnimationFrame(()=>window.scrollTo({top:170,behavior:'smooth'}))}
function saveNote(date,val){state.notes=state.notes||{};state.notes[date]=val;localStorage.setItem(STORE,JSON.stringify(state))}
function openEdit(date){let d=mergedDays().find(x=>x.date===date);document.getElementById('editform').innerHTML=['dest','plan','detour','contact','status'].map(k=>`<div class="field"><label>${k}</label><textarea id="f-${k}" ${k==='status'?'rows="1"':''}>${esc(d[k]||'')}</textarea></div>`).join('')+`<input type="hidden" id="f-date" value="${date}">`;document.getElementById('modal').classList.add('open')}
function closeEdit(){document.getElementById('modal').classList.remove('open')}
function saveEdit(){let date=document.getElementById('f-date').value;state.days=state.days||{};state.days[date]={};['dest','plan','detour','contact','status'].forEach(k=>state.days[date][k]=document.getElementById('f-'+k).value);localStorage.setItem(STORE,JSON.stringify(state));closeEdit();renderHome()}
function addExpense(){let desc=document.getElementById('exdesc').value,amount=document.getElementById('examt').value;if(!desc)return;state.expenses=state.expenses||[];state.expenses.push({desc,amount});localStorage.setItem(STORE,JSON.stringify(state));showExpenses()}
function delExpense(i){state.expenses.splice(i,1);localStorage.setItem(STORE,JSON.stringify(state));showExpenses()}
function saveDiary(){state.diary=document.getElementById('diary').value;localStorage.setItem(STORE,JSON.stringify(state));alert('Diary saved on this device.')}
function resetEdits(){if(confirm('Reset all local edits, notes, expenses and diary on this device?')){localStorage.removeItem(STORE);state={};renderHome();}}
function nav(active='home'){document.getElementById('nav').innerHTML=`<button class="pill ${active==='home'?'active':''}"onclick="renderHome();setActiveNav('home');window.scrollTo({top:0,behavior:'smooth'})">🏠 Home</button>`+[1,2,3,4,5,6,7,8,9].map(w=>`<button class="pill ${active===('w'+w)?'active':''}" onclick="showWeek(${w})">W${w}</button>`).join('')+`<button class="pill ${active==='all'?'active':''}" onclick="showAll()">All days</button>`}
function showWeek(w){nav('w'+w);let ds=mergedDays();renderWeeks(ds);requestAnimationFrame(()=>document.getElementById('week-'+w)?.scrollIntoView({behavior:'smooth',block:'start'}))}
nav();loadTextSize();syncStickyOffset();window.addEventListener('resize',syncStickyOffset);renderHome();
</script></body></html>
