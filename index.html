function showAlterMode(mode){if(mode==='find'){document.getElementById('alterModal').innerHTML='<div class="sheet"><h2>🔎 Find Something</h2><p class="muted">Ask for food, coffee, a sight or a useful stop. This is research only; your itinerary will not change unless you later choose Add this to my itinerary.</p><div class="field"><label>What are you looking for?</label><textarea id="findText" style="min-height:110px" placeholder="e.g. Find the best deli sandwich in NYC"></textarea></div><div class="modalbar"><button class="btn light" onclick="renderAlterForm()">Back</button><button class="btn navy" onclick="findSomething()">Find options</button></div></div>';return}let labels={add:['➕ Add Something','What would you like to add?','e.g. Add a good Texas BBQ stop somewhere on our route','Choose a day'],change:['🔄 Change My Trip','What would you like to change?','e.g. Make Thursday’s driving day easier','Choose the day to update'],remove:['❌ Remove Something','What should be removed?','e.g. Remove this stop','Choose the day to remove']},x=labels[mode];document.getElementById('alterModal').innerHTML='<div class="sheet"><h2>'+x[0]+'</h2><p class="muted">'+(mode==='remove'?'The selected day will be removed from this device until Reset Edits restores it.':'Describe it first, then choose the day it belongs to.')+'</p><div class="field"><label>'+x[1]+'</label><textarea id="alterText" style="min-height:130px" placeholder="'+x[2]+'"></textarea></div><input type="hidden" id="alterAction" value="'+mode+'"><div class="modalbar"><button class="btn light" onclick="renderAlterForm()">Back</button><button class="btn navy" onclick="proposeAlter()">'+x[3]+'</button></div></div>'}
function findOptions(text){let q=text.toLowerCase(),nyc=q.includes('nyc')||q.includes('new york'),coffee=q.includes('coffee'),lunch=q.includes('lunch'),deli=q.includes('deli')||q.includes('sandwich');if(nyc&&deli)return[{name:"Katz's Delicatessen",address:'205 E Houston St, New York, NY',why:'Classic NYC pastrami destination, close to the Lower East Side and easy to pair with a downtown day.',details:'Check live hours, wait time and pricing before leaving.',day:'2026-09-01'},{name:'Sarge’s Delicatessen & Diner',address:'548 3rd Ave, New York, NY',why:'A practical Midtown deli option near the Times Square hotel base.',details:'Check live hours and current ratings in Maps.',day:'2026-09-02'}];let d=mergedDays()[0],place=coffee?'Coffee near '+d.dest:lunch?'Lunch near '+d.dest:'Useful stop near '+d.dest;return[{name:place,address:d.dest,why:'Matches your first itinerary location; open Maps to compare nearby live choices.',details:'Live hours, ratings and prices are shown in Google Maps.',day:d.date}]}

function alterCandidates(text){let q=text.toLowerCase().replace(/[^a-z0-9\s]/g,' ');let words=q.split(/\s+/).filter(w=>w.length>2&&!['add','the','good','stop','somewhere','along','our','route','please','want','would','like'].includes(w));let ds=mergedDays();let matches=ds.map(d=>{let hay=[d.dest,d.plan,d.detour,d.route,d.contact].join(' ').toLowerCase();let score=0;words.forEach(w=>{if(hay.includes(w))score+=2});if(q.includes('texas')&&hay.includes('texas'))score+=8;if(q.includes('bbq')&&hay.includes('bbq'))score+=8;if(q.includes('vegas')&&hay.includes('las vegas'))score+=8;if(q.includes('yellowstone')&&hay.includes('yellowstone'))score+=8;if(q.includes('yosemite')&&hay.includes('yosemite'))score+=8;return {d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);return matches.slice(0,6).map(x=>x.d)}
function proposeAlter(){let action=document.getElementById('alterAction').value,text=document.getElementById('alterText').value.trim();if(!text){alert('Please describe the change first.');return}let q=text.toLowerCase(),ds=mergedDays(),dateMatch=q.match(/\b(?:sep(?:tember)?)[\s-]*(\d{1,2})\b|\b(\d{1,2})[\s-]*(?:sep(?:tember)?)\b/),dayMatch=q.match(/\b(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i),dates=ds.filter(d=>{let okDate=!dateMatch||d.date===`2026-09-${String(dateMatch[1]||dateMatch[2]).padStart(2,'0')}`;let okDay=!dayMatch||d.dow.toLowerCase()===dayMatch[0].toLowerCase();return okDate&&okDay}),words=q.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['add','the','good','stop','somewhere','along','our','route','please','want','would','like','need','get','until','later','day','time','leave','back','work','working'].includes(w)),hits=dates.length?dates:ds.map(d=>{let hay=(d.dest+' '+d.short+' '+d.plan+' '+d.detour+' '+d.route+' '+d.contact).toLowerCase(),score=0;words.forEach(w=>{if(hay.includes(w))score+=2});if(q.includes('milwaukee')&&hay.includes('milwaukee'))score+=10;if(q.includes('ortonville')&&hay.includes('ortonville'))score+=10;return{d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.d);let chosen=hits.slice(0,6),out=chosen.map(d=>'<button class="btn light" data-date="'+esc(d.date)+'" data-action="'+esc(action)+'" data-text="'+esc(text)+'" onclick="applyAlterFromSuggestion(this)">'+esc(d.short)+' • '+esc(d.dest)+'</button>').join('');if(!out)out='<p>No matching date found. Please include the date or destination.</p>';document.getElementById('alterModal').classList.add('open');document.getElementById('alterModal').innerHTML='<div class="sheet"><h2>Choose a day</h2><p>Choose the day that best matches your request.</p>'+out+'<div class="modalbar"><button class="btn light" onclick="renderAlterForm()">Cancel</button></div></div>';window.scrollTo({top:170,behavior:'smooth'})}
function applyAlterFromSuggestion(button){applyAlter(button.dataset.date,button.dataset.action,button.dataset.text)}
function applyAlter(date,action,text){let d=mergedDays().find(x=>x.date===date);if(!d)return;state.days=state.days||{};if(action==='remove'){state.removedDays=state.removedDays||[];if(!state.removedDays.includes(date))state.removedDays.push(date);localStorage.setItem(STORE,JSON.stringify(state));closeAlter();renderHome();alert(d.short+' removed from this device\'s itinerary. Use Reset Edits to restore it.');return}let update=state.days[date]||{},note=(action==='add'?'Added: ':'Changed: ')+text;update.plan=action==='add'?[d.plan,note].filter(Boolean).join('\n'):text;state.days[date]=update;localStorage.setItem(STORE,JSON.stringify(state));closeAlter();renderHome();let card=document.getElementById('day-'+date);card?.scrollIntoView({behavior:'smooth',block:'start'});alert((action==='add'?'Addition':'Change')+' saved for '+d.short+'.')}

function renderAlter2BookingContext(context){if(!context)return '';return `<div class="findOption"><b>${esc(context.status)} — UNCHANGED</b><p>${esc(context.name)}${context.confirmation?` &bull; Confirmation ${esc(context.confirmation)}`:''}</p><p class="muted">${esc(context.note)}</p></div>`}
function renderAlter2OvernightOptions(options){if(!options||!options.length)return '';return `<div class="alter2-overnight-review"><p><b>OVERNIGHT OPTIONS — SUGGESTED / NOT BOOKED</b></p>${options.map(option=>`<div class="alter2-route-component"><b>${esc(option.type)}: ${esc(option.name)}</b><br>${esc(option.detail)}${option.warning?`<br><span class="alter2-warning">${esc(option.warning)}</span>`:''}<br><span class="muted">Availability has not been verified. Check access and fit for the 30-ft RV before relying on this stop.</span></div>`).join('')}</div>`}
function renderAlter2SelectedOvernight(selection,current){if(!selection)return '';return `<div class="alter2-overnight-review"><p><b>DATE:</b> ${esc(current.short)}</p><p><b>CURRENT ROUTE / DESTINATION:</b> ${esc(current.dest)}</p><p><b>SELECTED OVERNIGHT STOP:</b> ${esc(selection.name)}</p><p><b>STATUS:</b> SUGGESTED / NOT BOOKED</p>${selection.address?`<p><b>Address:</b> ${esc(selection.address)}</p>`:''}${selection.phone?`<p><b>Phone:</b> ${esc(selection.phone)}</p>`:''}<p>${esc(selection.detail)}</p>${selection.warning?`<span class="alter2-warning">${esc(selection.warning)}</span>`:''}<p class="muted">Availability or overnight permission has NOT been verified. Approval records this only as a selected overnight lead.</p></div>`}
function renderAlter2ChangeRows(analysis){let selected=alter2SelectedRepair(analysis),reviewChanges=selected&&selected.changes.length?selected.changes:analysis.changes;return reviewChanges.map(change=>{let current=alter2Day(change.date),proposed={...current,...change.changes},parts=alter2RouteParts(proposed),travel=parts.length>1?`<p><b>START:</b> ${esc(parts[0])}<br><b>DESTINATION / STOPPING AREA:</b> ${esc(parts[parts.length-1])}</p>`:'',verified=change.changes.verifiedRoute,details=verified?renderAlter2VerifiedDay(verified):parts.length>1&&analysis.kind!=='overnight'?'<p class="alter2-warning"><b>ROUTE / DISTANCE / DRIVING TIME:</b> ROUTE CHECKING — approval remains blocked.</p>':'',plan=change.changes.plan?`<p><b>Plan / logistics:</b><br>${alter2ReviewText(change.changes.plan)}</p>`:'',detour=change.changes.detour?`<p><b>Optional / detour:</b><br>${alter2ReviewText(change.changes.detour)}</p>`:'',contact=change.changes.contact?`<p><b>Contact / address:</b><br>${alter2ReviewText(change.changes.contact)}</p>`:'';return `<div class="findOption alter2-diff"><b>${esc(current.short)} — ${esc(proposed.dest)}</b>${travel}<p class="muted"><b>WHY THIS STOP:</b> ${esc(change.reason)}</p>${renderAlter2BookingContext(change.bookingContext)}${details}${renderAlter2SelectedOvernight(change.changes.overnightSelection,current)}${plan}${detour}${contact}${renderAlter2OvernightOptions(change.overnightOptions)}</div>`}).join('')}
function renderAlter2RepairLeg(leg){let day=leg.changeDate&&alter2Day(leg.changeDate);return `<div class="alter2-route-component"><b>${day?`${esc(day.short)} — `:''}${esc(leg.origin)} → ${esc(leg.destination)}</b><br>${leg.verification==='verified'?`${esc(String(leg.distanceKm))} km &bull; ${esc(formatDrivingDuration(leg.durationMinutes))} &bull; <b>VERIFIED</b> &bull; ${alter2StatusIcon(leg.pressure)} ${esc(leg.pressure)}`:'ROUTE VERIFICATION REQUIRED'}</div>`}
function renderAlter2RepairOptions(analysis){if(!analysis.routeSafety||!analysis.routeSafety.redDays.length)return '';if(analysis.repairStatus==='checking')return '<section id="alter2Repairs"><h3>RED DRIVING CONFLICT</h3><div class="alter2-warning">REPAIR OPTIONS CHECKING</div></section>';let options=(analysis.repairs||[]).map((option,index)=>`<article class="findOption alter2-repair"><h3>${esc(option.title)}</h3>${option.recommended?'<p><b>RECOMMENDED REPAIR</b></p>':''}${option.legs.map(renderAlter2RepairLeg).join('')}<p><b>Repair pressure:</b> ${alter2StatusIcon(option.pressure)} ${esc(option.pressure)}</p><p><b>Protected booking:</b> ${esc(option.protectedImpact)}</p><p><b>Optional changes:</b> ${esc(option.optionalImpact)}</p><p><b>MUST priorities:</b> ${esc(option.mustImpact)}</p>${option.failureReason?`<p class="alter2-warning">${esc(option.failureReason)}</p>`:''}${option.id==='keep-original'?'<button class="btn light" onclick="leaveAlter2()">KEEP ORIGINAL — LEAVE IT</button>':`<button class="btn navy" onclick="selectAlter2Repair(${index})" ${option.viable?'':'disabled'}>${option.viable?'SELECT THIS REPAIR':'NOT SAFE TO APPLY'}</button>`}</article>`).join('');return `<section id="alter2Repairs"><h3>RED DRIVING CONFLICT — choose a verified repair</h3><p class="muted">The unrepaired RED proposal cannot be approved.</p><div class="alter2-grid">${options}</div></section>`}
function alter2SelectedRepair(analysis){return Number.isInteger(analysis&&analysis.selectedRepairIndex)&&analysis.repairs&&analysis.repairs[analysis.selectedRepairIndex]}
function alter2ApprovalReady(analysis){if(analysis&&/^(?:departure-travel|route-balance|day-transfer)$/.test(analysis.kind)&&analysis.routeVerification&&analysis.routeVerification.legs.length){let legs=analysis.routeVerification.legs,origin=legs[0].origin,destination=legs[legs.length-1].destination;if(!alter2ForwardRouteSequence(origin,destination,legs))return false}let repair=alter2SelectedRepair(analysis);if(analysis&&analysis.routeSafety&&analysis.routeSafety.redDays.length)return !!(repair&&repair.viable&&repair.changes.length&&repair.legs.every(leg=>leg.verification==='verified'&&leg.pressure!=='RED'));return analysis.status!=='RED'&&analysis.changes.length&&alter2RouteCheckReady(analysis)}
function selectAlter2Repair(index){let analysis=alter2Pending,repair=analysis&&analysis.repairs&&analysis.repairs[index];if(!repair||!repair.viable||!repair.changes.length)return false;analysis.selectedRepairIndex=index;let changes=document.getElementById('alter2ChangeRows');if(changes)changes.innerHTML=renderAlter2ChangeRows(analysis);let button=document.getElementById('alter2ApproveButton');if(button){button.disabled=!alter2ApprovalReady(analysis);button.textContent='APPROVE SELECTED REPAIR'}return true}
function updateAlter2RouteReview(analysis,modal){if(alter2Pending!==analysis||modal!==document.getElementById('alterModal'))return;let target=document.getElementById('alter2RouteVerification');if(target)target.innerHTML=`<div class="alter2-step">${analysis.routeVerification.status==='verified'?'VERIFIED ROUTES':'ROUTE VERIFICATION REQUIRED'}</div>${analysis.routeVerification.legs.map(renderAlter2RouteLeg).join('')}`;let banner=document.getElementById('alter2RouteBanner'),bannerState=alter2ReviewBanner(analysis);if(banner&&bannerState){banner.className=bannerState.state==='verified'?'alter2-status GREEN':'alter2-warning';banner.innerHTML=esc(bannerState.text)}let changes=document.getElementById('alter2ChangeRows');if(changes)changes.innerHTML=renderAlter2ChangeRows(analysis)||'<div class="findOption">No automatic changes are available.</div>';let repairTarget=document.getElementById('alter2Repairs');if(repairTarget)repairTarget.outerHTML=renderAlter2RepairOptions(analysis);else if(analysis.routeSafety&&analysis.routeSafety.redDays.length&&changes)changes.insertAdjacentHTML('afterend',renderAlter2RepairOptions(analysis));let button=document.getElementById('alter2ApproveButton');if(button){button.disabled=!alter2ApprovalReady(analysis);button.textContent=analysis.routeSafety&&analysis.routeSafety.redDays.length?'SELECT A SAFE REPAIR FIRST':'APPROVE CHANGES'}}
function showAlter2FinalProposal(){let analysis=alter2Pending&&alter2EnsureDepartureTravelPlan(alter2Pending.request,alter2Pending);if(!analysis)return;alter2Pending=analysis;if(analysis.proposalValidation)analysis.proposalValidation=alter2ValidateProposal(analysis.changes);let invalid=analysis.proposalValidation&&!analysis.proposalValidation.valid,needsRoute=analysis.requiresRouteVerification&&!invalid,blocked=analysis.status==='RED'||invalid||needsRoute||!analysis.changes.length;if(needsRoute)analysis.routeVerification={status:'checking',legs:(analysis.routeLegs||[]).map(leg=>({...leg,verification:'checking'}))};let banner=alter2ReviewBanner(analysis),modal=document.getElementById('alterModal');modal.innerHTML=`<div class="sheet"><div class="alter2-step">Final proposed changes — still not applied</div><h2>Review Before Approval</h2><p><b>REQUEST:</b> ${esc(analysis.request)}</p>${banner?`<div id="alter2RouteBanner" class="${banner.state==='verified'?'alter2-status GREEN':'alter2-warning'}">${esc(banner.text)}</div>`:''}${renderAlter2RouteVerification(analysis)}<h3>Only these fields would change</h3><div id="alter2ChangeRows">${renderAlter2ChangeRows(analysis)||'<div class="findOption">No automatic changes are available.</div>'}</div>${renderAlter2RepairOptions(analysis)}<p class="muted">Confirmed bookings and every unlisted itinerary field remain unchanged.</p><div class="modalbar"><button class="btn light" onclick="cancelAlter2()">CANCEL</button><button id="alter2ApproveButton" class="btn navy" onclick="approveAlter2Changes()" ${blocked?'disabled':''}>APPROVE CHANGES</button></div></div>`;if(needsRoute)verifyAlter2Routes(analysis).then(()=>updateAlter2RouteReview(analysis,modal)).catch(()=>{analysis.routeVerification={status:'failed',legs:analysis.routeVerification.legs.map(leg=>leg.verification==='verified'?leg:{...leg,verification:'failed'})};analysis.requiresRouteVerification=true;updateAlter2RouteReview(analysis,modal)})}
function leaveAlter2(){alter2Pending=null;closeAlter()}
function cancelAlter2(){alter2Pending=null;closeAlter()}
function alter2VerifiedRoutePatch(analysis,change){let verified=change&&change.changes&&change.changes.verifiedRoute;if(!verified||!alter2VerifiedSequence(change,analysis.routeVerification.legs.filter(item=>item.changeDate===change.date&&item.verification==='verified')))return {};return {weather:change.changes.weather,verifiedRoute:verified}}
function alter2CommittedValue(value){if(typeof value==='string')return value.replace(/\bPROPOSED ONLY\s*(?:[—–:-]\s*)?/gi,'').trim();if(Array.isArray(value))return value.map(alter2CommittedValue);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([key,item])=>[key,alter2CommittedValue(item)]));return value}
function alter2ApprovedRouteHeader(analysis,changes){let legs=analysis.routeVerification&&analysis.routeVerification.legs||[];if(!legs.length)return null;let first=alter2Day(changes[0].date),original=String(first&&first.route||''),oldParts=original.split(/(?:→|â†’)/).map(part=>part.trim()).filter(Boolean),origin=legs[0].origin,originIndex=oldParts.findIndex(part=>alter2LocationMatches(part,origin)),prefix=originIndex>=0?oldParts.slice(0,originIndex+1):[origin],sequence=[...prefix,...legs.map(leg=>leg.destination)],lastDate=changes[changes.length-1].date,next=mergedDays()[mergedDays().findIndex(day=>day.date===lastDate)+1],nextLabel=next&&routeDestination(next);if(nextLabel&&!sequence.some(part=>alter2LocationMatches(part,nextLabel)))sequence.push(nextLabel);return [...new Set(sequence.map(part=>String(part).trim()))].join(' → ')}
function alter2ReconcileApprovedDownstream(analysis,changes){if(!/^(?:departure-travel|route-balance)$/.test(analysis.kind)||!changes.length)return;let ordered=[...changes].sort((a,b)=>a.date.localeCompare(b.date)),lastDate=ordered[ordered.length-1].date,days=storedMergedDays(),lastIndex=days.findIndex(day=>day.date===lastDate),next=days[lastIndex+1],legs=analysis.routeVerification&&analysis.routeVerification.legs||[],newPlaces=legs.flatMap(leg=>[leg.origin,leg.destination]);if(next&&!isLocked(next)){let from=String(next.weather||'').match(/\bfrom\s+([^•]+)/i),staleOrigin=from&&from[1].trim(),localIntent=/\bLOCAL\b|relax|rest day|no major driving/i.test([next.dest,next.plan].join(' '));if(staleOrigin&&localIntent&&!newPlaces.some(place=>alter2LocationMatches(place,staleOrigin))){let temperature=String(next.weather||'').split('•')[0].trim();state.days[next.date]={...(state.days[next.date]||{}),weather:`${temperature} • LOCAL`,route_maps:mapSearchUrl(next.dest_query||routeDestination(next))}}}let first=alter2Day(ordered[0].date),header=alter2ApprovedRouteHeader(analysis,ordered);if(first&&header){state.weekRoutes=state.weekRoutes||{};state.weekRoutes[first.week]=header;ordered.forEach(change=>{state.days[change.date]={...(state.days[change.date]||{}),route:header}});if(next&&next.week===first.week&&!isLocked(next))state.days[next.date]={...(state.days[next.date]||{}),route:header}}}
function approveAlter2Changes(){let analysis=alter2Pending;if(!analysis||!alter2ApprovalReady(analysis)){alert('This proposal cannot be applied until protected conflicts or route verification are resolved and a safe repair is selected.');return false}let repair=alter2SelectedRepair(analysis),changes=repair?repair.changes:analysis.changes,proposal={changes};if(!proposalIsSafe(proposal)){alert('A protected booking or commitment would be affected. Nothing was changed.');return false}state.days=state.days||{};changes.forEach(change=>{let committed=alter2CommittedValue({...change.changes,...(repair?{}:alter2VerifiedRoutePatch(analysis,change))});state.days[change.date]={...(state.days[change.date]||{}),...committed}});alter2ReconcileApprovedDownstream(analysis,changes);localStorage.setItem(STORE,JSON.stringify(state));alter2Pending=null;closeAlter();renderHome();alert('Approved changes applied. Confirmed bookings remain protected.');return true}
function beginOvernightAlter2(date,index){let day=alter2Day(date),option=day&&overnightOptionsForDay(day)[index];if(!day||!option)return;let request=`Add this suggested overnight on ${day.short}: ${option.name}`;renderAlter2Analysis(analyseAlter2Request(request,{kind:'overnight',date,option}))}
</script>
