function alterCandidates(text){let q=text.toLowerCase().replace(/[^a-z0-9\s]/g,' ');let words=q.split(/\s+/).filter(w=>w.length>2&&!['add','the','good','stop','somewhere','along','our','route','please','want','would','like'].includes(w));let ds=mergedDays();let matches=ds.map(d=>{let hay=[d.dest,d.plan,d.detour,d.route,d.contact].join(' ').toLowerCase();let score=0;words.forEach(w=>{if(hay.includes(w))score+=2});if(q.includes('texas')&&hay.includes('texas'))score+=8;if(q.includes('bbq')&&hay.includes('bbq'))score+=8;if(q.includes('vegas')&&hay.includes('las vegas'))score+=8;if(q.includes('yellowstone')&&hay.includes('yellowstone'))score+=8;if(q.includes('yosemite')&&hay.includes('yosemite'))score+=8;return {d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);return matches.slice(0,6).map(x=>x.d)}
function proposeAlter(){let action=document.getElementById('alterAction').value,text=document.getElementById('alterText').value.trim();if(!text){alert('Please describe the change first.');return}let q=text.toLowerCase(),ds=mergedDays(),dateMatch=q.match(/\b(?:sep(?:tember)?)[\s-]*(\d{1,2})\b|\b(\d{1,2})[\s-]*(?:sep(?:tember)?)\b/),dayMatch=q.match(/\b(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i),dates=ds.filter(d=>{let okDate=!dateMatch||d.date===`2026-09-${String(dateMatch[1]||dateMatch[2]).padStart(2,'0')}`;let okDay=!dayMatch||d.dow.toLowerCase()===dayMatch[0].toLowerCase();return okDate&&okDay}),words=q.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['add','the','good','stop','somewhere','along','our','route','please','want','would','like','need','get','until','later','day','time','leave','back','work','working'].includes(w)),hits=dates.length?dates:ds.map(d=>{let hay=(d.dest+' '+d.short+' '+d.plan+' '+d.detour+' '+d.route+' '+d.contact).toLowerCase(),score=0;words.forEach(w=>{if(hay.includes(w))score+=2});if(q.includes('milwaukee')&&hay.includes('milwaukee'))score+=10;if(q.includes('ortonville')&&hay.includes('ortonville'))score+=10;return{d,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.d);let chosen=hits.slice(0,6),out=chosen.map(d=>'<button class="btn light" data-date="'+esc(d.date)+'" data-action="'+esc(action)+'" data-text="'+esc(text)+'" onclick="applyAlterFromSuggestion(this)">'+esc(d.short)+' • '+esc(d.dest)+'</button>').join('');if(!out)out='<p>No matching date found. Please include the date or destination.</p>';document.getElementById('alterModal').classList.add('open');document.getElementById('alterModal').innerHTML='<div class="sheet"><h2>Choose a day</h2><p>Choose the day that best matches your request.</p>'+out+'<div class="modalbar"><button class="btn light" onclick="renderAlterForm()">Cancel</button></div></div>';window.scrollTo({top:170,behavior:'smooth'})}

function applyAlter(date,action,text){let d=mergedDays().find(x=>x.date===date);if(!d)return;state.days=state.days||{};if(action==='remove'){state.removedDays=state.removedDays||[];if(!state.removedDays.includes(date))state.removedDays.push(date);localStorage.setItem(STORE,JSON.stringify(state));closeAlter();renderHome();alert(d.short+' removed from this device\'s itinerary. Use Reset Edits to restore it.');return}let update=state.days[date]||{},note=(action==='add'?'Added: ':'Changed: ')+text;update.plan=action==='add'?[d.plan,note].filter(Boolean).join('\n'):text;state.days[date]=update;localStorage.setItem(STORE,JSON.stringify(state));closeAlter();renderHome();let card=document.getElementById('day-'+date);card?.scrollIntoView({behavior:'smooth',block:'start'});alert((action==='add'?'Addition':'Change')+' saved for '+d.short+'.')}

function routeImpactSummary(day,route){if(isLocked(day))return {impact:'RED',reason:'This driving day contains a protected booking or fixed commitment and cannot be moved automatically.',solution:'Keep the protected commitment fixed; review nearby flexible days instead.'};if(!route||!route.reliable)return {impact:'YELLOW',reason:'Verified routing is unavailable for this driving leg.',solution:'Confirm the route distance and timing before considering an itinerary change.'};if(route.distanceKm>500||route.durationMinutes>480){let midpoint=route.waypoints&&route.waypoints[Math.floor(route.waypoints.length/2)],area=midpoint&&midpoint.name&&midpoint.name!==route.origin?.label&&midpoint.name!==route.destination?.label?midpoint.name:'a suggested halfway overnight area';return {impact:'YELLOW',reason:`${route.distanceKm} km / about ${route.durationMinutes} minutes is a high-pressure driving leg.`,solution:`Consider splitting the drive via ${area} — accommodation/campground to arrange.`}}return {impact:'GREEN',reason:`${route.distanceKm} km / about ${route.durationMinutes} minutes is practical with no significant conflict identified.`,solution:'No split is needed; retain the current driving plan unless another request changes it.'}}
